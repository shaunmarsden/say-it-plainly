name: Checks

# Cheap, deterministic checks: the skills match their sources, links resolve,
# the house punctuation holds, and the checker's tests pass. They cannot judge
# whether the rules or the skills are any good.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Skills match their sources
        run: python scripts/build_skills.py --check
      - name: Repository checks
        run: python scripts/check_repo.py
      - name: Build and repository tests
        run: python -m unittest tests/test_build.py
      - name: Checker tests
        run: node --test tests/checker.test.js
